name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m compileall -q custom_components research scripts tests
      - run: python -m pytest --cov=custom_components/tanita_healthplanet --cov-report=term-missing
      - run: python -m ruff check custom_components tests scripts/build_release.py scripts/secret_audit.py scripts/validate_json.py scripts/validate_release.py
      - run: python -m ruff format --check custom_components tests scripts/build_release.py scripts/secret_audit.py scripts/validate_json.py scripts/validate_release.py
      - run: python -m mypy custom_components scripts/build_release.py scripts/secret_audit.py scripts/validate_json.py scripts/validate_release.py
      - run: python scripts/validate_json.py
      - run: python scripts/secret_audit.py
      - run: python -m pytest tests/test_research_healthplanet_backend.py::test_backup_integrity_exclusions_and_retention -q
