name: Validated Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated stable tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
      target: ${{ steps.metadata.outputs.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: metadata
        name: Validate stable version and annotated tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          python scripts/validate_release.py \
            --tag "$TAG" \
            --require-annotated-tag \
            --require-main-head
          TARGET="$(git rev-list -n 1 "refs/tags/$TAG")"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'title=HealthPlanet for Home Assistant %s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'target=%s\n' "$TARGET" >> "$GITHUB_OUTPUT"

  test:
    needs: validate_release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.validate_release.outputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m compileall -q custom_components research scripts tests
      - run: python -m pytest --cov=custom_components/tanita_healthplanet --cov-report=term-missing
      - run: python -m ruff check custom_components tests scripts/secret_audit.py scripts/validate_json.py scripts/validate_release.py
      - run: python -m ruff format --check custom_components tests scripts/secret_audit.py scripts/validate_json.py scripts/validate_release.py
      - run: python -m mypy custom_components scripts/secret_audit.py scripts/validate_json.py scripts/validate_release.py
      - run: python scripts/validate_json.py
      - run: python scripts/secret_audit.py
      - run: python -m pytest tests/test_research_healthplanet_backend.py::test_backup_integrity_exclusions_and_retention -q

  hacs:
    needs: validate_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.tag }}
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
          ignore: brands description license topics

  hassfest:
    needs: validate_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.tag }}
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  release:
    needs: [validate_release, test, hacs, hassfest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate_release.outputs.tag }}
      TITLE: ${{ needs.validate_release.outputs.title }}
    steps:
      - name: Create stable GitHub Release once
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_already_exists"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TITLE" \
            --generate-notes
